services:
  stl-mcp:
    build: .
    restart: unless-stopped
    # local only by default – expose via a reverse proxy (the Caddy profile below or your own)
    ports: ["${BIND:-127.0.0.1}:8765:8765"]
    environment:
      DATABASE_URL: postgresql://stl:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/stl
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SIGNUP: ${SIGNUP:-0}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      TRUSTED_PROXY: ${TRUSTED_PROXY:-0}
      MAX_MODELS_PER_USER: ${MAX_MODELS_PER_USER:-100}
      MAX_DISK_MB_PER_USER: ${MAX_DISK_MB_PER_USER:-500}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      MCP_TOKEN: ${MCP_TOKEN:?set MCP_TOKEN in .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8765}
      ALLOW_SCRIPT: ${ALLOW_SCRIPT:-0}
      FILES_PUBLIC: ${FILES_PUBLIC:-0}
      UI_PUBLIC: ${UI_PUBLIC:-0}
      OAUTH: ${OAUTH:-1}
    volumes: ["${DATA_DIR:-./data}:/data"]
    depends_on:
      postgres: {condition: service_healthy}

  # Users, logins and tokens. Back it up with pg_dump (see README "Storage").
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: stl
    volumes: ["${PG_DATA_DIR:-./pgdata}:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "stl"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Throwaway database for the test suite: `docker compose --profile test up -d postgres-test`
  postgres-test:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: stl_test
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: [/var/lib/postgresql/data]

  # Optional HTTPS with an automatic certificate: `docker compose --profile caddy up -d`
  # Requires DOMAIN in .env, DNS pointing here and free ports 80/443.
  caddy:
    image: caddy:2.8
    profiles: [caddy]
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [stl-mcp]

volumes:
  caddy_data:
  caddy_config:
