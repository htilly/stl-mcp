name: Deploy dev

# Every successful build of main goes to dev.autosmith.eu (service
# stl-mcp-dev on tillyse). Prod only moves on a release tag - see release.yml.
# The deploy itself, with its gates, checks and rollback, is deploy.yml.

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-stl-mcp-dev
  cancel-in-progress: false

jobs:
  deploy:
    # Only a successful build, of a push (not a PR), to main, in this repo
    # (not a fork).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    # deploy.yml's promote job asks for packages: write. It never runs for dev,
    # but a called workflow may not ask for more than its caller grants.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      target: dev
      sha: ${{ github.event.workflow_run.head_sha }}
      # actor = whoever started the build. triggering_actor = whoever started
      # this particular run attempt, which differs on a re-run.
      run_actor: ${{ github.event.workflow_run.actor.login }}
      rerun_actor: ${{ github.event.workflow_run.triggering_actor.login }}
      # Text someone else can control: deploy.yml only ever reads it from env.
      commit_message: ${{ github.event.workflow_run.head_commit.message }}
      build_url: ${{ github.event.workflow_run.html_url }}
