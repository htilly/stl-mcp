name: Deploy to tillyse

# Reusable: called by deploy-dev.yml (every successful build of main ->
# dev.autosmith.eu) and release.yml (a v* tag -> autosmith.eu). Nothing
# triggers it directly.
#
#   target  service       image tag on tillyse  URL                  token var
#   dev     stl-mcp-dev   :main                 dev.autosmith.eu     MCP_TOKEN_DEV
#   prod    stl-mcp       :release              autosmith.eu         MCP_TOKEN
#
# Prod never runs a fresh build: release.yml's tag is promoted by retagging the
# :main-<sha> image that dev already ran, so prod gets byte-for-byte that image.
#
# The runner talks to Docker through kraftmon-docker-proxy, which has BUILD=0
# and EXEC=0: this job CANNOT build anything on tillyse and cannot exec into any
# container. It can only pull an already published image from ghcr.io and
# recreate the single service for its target - it never touches the other ~60
# containers on the machine.
#
# The repo is PUBLIC, so the gates are what keep fork code off the machine: the
# callers only call this for pushes in this repo, and the gate job below
# requires that the accounts behind the run are listed in ALLOWED_ACTORS.
#
# Every compose call below passes --env-file "$COMPOSE_ENV_FILE". The runner
# cannot see /config/.env, so without that flag ${TZ} etc. would be empty when
# compose reads the file.

on:
  workflow_call:
    inputs:
      target:
        description: "dev or prod"
        type: string
        required: true
      sha:
        description: "dev: the full commit sha that was built on main"
        type: string
        default: ""
      version:
        description: "prod: the release tag to deploy, e.g. v1.4.0"
        type: string
        default: ""
      run_actor:
        description: "whoever started the run that led here"
        type: string
        required: true
      rerun_actor:
        description: "whoever started this run attempt (differs on a re-run)"
        type: string
        required: true
      commit_message:
        description: "dev: the commit message, for the ntfy notification"
        type: string
        default: ""
      build_url:
        description: "dev: link to the build run, for the summary"
        type: string
        default: ""

permissions:
  contents: read

env:
  IMAGE: ghcr.io/htilly/stl-mcp

jobs:
  # ---------------------------------------------------------------------------
  # Gate. Runs on GitHub's own runner, i.e. BEFORE anything at all may land on
  # tillyse or be retagged on ghcr.io. If it does not let the run through,
  # nothing else starts.
  gate:
    name: Check who triggered this
    runs-on: ubuntu-latest

    outputs:
      allowed: ${{ steps.check.outputs.allowed }}

    env:
      # =====================================================================
      # WHICH ACCOUNTS MAY DEPLOY TO TILLYSE (dev and prod)
      # Space-separated GitHub usernames. Add more here.
      # Empty list = no deploy happens at all.
      ALLOWED_ACTORS: "htilly"
      # =====================================================================

      # Both must be in the list, otherwise someone else could re-run your
      # build and deploy.
      RUN_ACTOR: ${{ inputs.run_actor }}
      RERUN_ACTOR: ${{ inputs.rerun_actor }}
      TARGET: ${{ inputs.target }}

    steps:
      - name: Match actor against the allowlist
        id: check
        run: |
          set -euo pipefail

          case "$TARGET" in
            dev|prod) ;;
            *) echo "::error::unknown target '$TARGET'"; exit 1 ;;
          esac

          allowed=true
          for who in "$RUN_ACTOR" "$RERUN_ACTOR"; do
            if [ -z "$who" ]; then
              echo "::warning::empty username - no deploy"
              allowed=false
              continue
            fi
            case " $ALLOWED_ACTORS " in
              *" $who "*) echo "ok: $who is in ALLOWED_ACTORS" ;;
              *) echo "::warning::$who is NOT in ALLOWED_ACTORS - no deploy"; allowed=false ;;
            esac
          done

          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          {
            echo "### Gate ($TARGET)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| started the run | \`$RUN_ACTOR\` |"
            echo "| started this attempt | \`$RERUN_ACTOR\` |"
            echo "| allowed accounts | \`$ALLOWED_ACTORS\` |"
            echo "| deploy | \`$allowed\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Prod only: point :<version> and :release on ghcr.io at the image main built
  # from the tagged commit. No build happens here.
  promote:
    name: Promote the main image to the release
    needs: gate
    if: needs.gate.outputs.allowed == 'true' && inputs.target == 'prod'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      subject: ${{ steps.resolve.outputs.subject }}

    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Resolve the release tag
        id: resolve
        run: |
          set -euo pipefail

          if ! printf '%s' "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$VERSION' is not a release tag like v1.4.0"
            exit 1
          fi
          git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null \
            || { echo "::error::tag $VERSION does not exist"; exit 1; }

          SHA=$(git rev-parse "refs/tags/$VERSION^{commit}")
          # Only what has been on main - and therefore on dev - may reach prod.
          git merge-base --is-ancestor "$SHA" origin/main \
            || { echo "::error::$VERSION ($SHA) is not on main"; exit 1; }

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "subject=Release $VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Retag the main image as the release
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          SRC="$IMAGE:main-${SHA::7}"

          # Tagging right after a merge is fine: wait for main's build to push
          # the image (up to 20 minutes) instead of failing.
          for attempt in $(seq 1 40); do
            if docker buildx imagetools inspect "$SRC" > /dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              echo "::error::$SRC does not exist - main never built $VERSION's commit successfully"
              exit 1
            fi
            echo "waiting for $SRC ($attempt/40)"
            sleep 30
          done

          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:release" "$SRC"
          echo "| release | \`$IMAGE:$VERSION\` = \`:release\` = \`$SRC\` |" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy stl-mcp (${{ inputs.target }}) to tillyse
    needs: [gate, promote]
    # promote is skipped for dev, which would skip this job too without the
    # explicit result check.
    if: >-
      !cancelled() &&
      needs.gate.outputs.allowed == 'true' &&
      (needs.promote.result == 'success' ||
       (inputs.target == 'dev' && needs.promote.result == 'skipped'))
    runs-on: [self-hosted, stl-mcp]

    # Second gate, on GitHub's side and independent of the YAML expressions
    # above: the dev environment only admits main, prod only main and v* tags.
    environment: ${{ inputs.target }}

    env:
      TARGET: ${{ inputs.target }}
      SERVICE: ${{ inputs.target == 'prod' && 'stl-mcp' || 'stl-mcp-dev' }}
      CONTAINER: ${{ inputs.target == 'prod' && 'stl-mcp' || 'stl-mcp-dev' }}
      SANDBOX_SERVICE: ${{ inputs.target == 'prod' && 'stl-mcp-sandbox' || 'stl-mcp-dev-sandbox' }}
      # The tag the service in /config/docker-compose.yml points at. The deploy
      # moves it locally to the image it pulled.
      MOVING_TAG: ${{ inputs.target == 'prod' && 'release' || 'main' }}
      # The name of the runner env var holding this instance's token.
      TOKEN_VAR: ${{ inputs.target == 'prod' && 'MCP_TOKEN' || 'MCP_TOKEN_DEV' }}
      FULL_SHA: ${{ inputs.target == 'prod' && needs.promote.outputs.sha || inputs.sha }}
      VERSION: ${{ inputs.version }}
      COMPOSE_PROJECT: config
      COMPOSE_DIR: /config
      # The runner shares config_default with the app and reaches it on the
      # container port (8765), not the host's 127.0.0.1 port.
      APP_URL: ${{ inputs.target == 'prod' && 'http://stl-mcp:8765' || 'http://stl-mcp-dev:8765' }}
      # The startup marker the app prints once it is actually up (server.py).
      # If it changes in one place it must change in both.
      READY_MARKER: STL_MCP_READY
      READY_TIMEOUT_SECONDS: "120"
      # DOCKER_HOST, NTFY_URL, NTFY_TOKEN, MCP_TOKEN, MCP_TOKEN_DEV,
      # COMPOSE_FILE_PATH and COMPOSE_ENV_FILE come from the runner's container
      # environment (see /config/docker-compose.yml and
      # /config/secrets/stl-mcp-runner.env on tillyse). The tokens only live
      # there - never in this repo.

    steps:
      # -----------------------------------------------------------------------
      - name: Preflight
        id: pre
        env:
          BUILD_URL: ${{ inputs.build_url }}
        run: |
          set -euo pipefail

          fail=0
          for v in DOCKER_HOST NTFY_URL NTFY_TOKEN "$TOKEN_VAR" COMPOSE_FILE_PATH COMPOSE_ENV_FILE; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v is not set in the runner's environment"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

          test -r "$COMPOSE_FILE_PATH" || { echo "::error::cannot read $COMPOSE_FILE_PATH"; exit 1; }
          test -r "$COMPOSE_ENV_FILE"  || { echo "::error::cannot read $COMPOSE_ENV_FILE"; exit 1; }
          docker version --format '{{.Server.Version}}' > /dev/null \
            || { echo "::error::cannot reach the socket proxy at $DOCKER_HOST"; exit 1; }

          # The compose file must actually point a service at the tag we deploy.
          if ! grep -qE "^\s+image:\s+${IMAGE}:${MOVING_TAG}\s*$" "$COMPOSE_FILE_PATH"; then
            echo "::error::$COMPOSE_FILE_PATH does not point $SERVICE at ${IMAGE}:${MOVING_TAG}"
            exit 1
          fi

          printf '%s' "$FULL_SHA" | grep -qE '^[0-9a-f]{40}$' \
            || { echo "::error::no commit sha to deploy ('$FULL_SHA')"; exit 1; }
          SHORT_SHA="${FULL_SHA:0:7}"
          STAMP="$(date +%Y%m%d-%H%M%S)"

          # dev pulls the sha-pinned build of main, prod the release tag that
          # promote pointed at that same image.
          if [ "$TARGET" = "prod" ]; then PULL_TAG="$VERSION"; else PULL_TAG="main-$SHORT_SHA"; fi

          echo "full_sha=$FULL_SHA"                   >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA"                 >> "$GITHUB_OUTPUT"
          echo "pull_tag=$PULL_TAG"                   >> "$GITHUB_OUTPUT"
          echo "rollback_tag=rollback-$TARGET-$STAMP" >> "$GITHUB_OUTPUT"
          echo "started_epoch=$(date +%s)"            >> "$GITHUB_OUTPUT"

          {
            echo "### Deploy $SERVICE ($TARGET) to tillyse"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`$FULL_SHA\` |"
            echo "| image | \`${IMAGE}:$PULL_TAG\` |"
            echo "| rollback tag | \`rollback-$TARGET-$STAMP\` |"
            [ -z "$BUILD_URL" ] || echo "| build | $BUILD_URL |"
          } >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------------
      - name: Capture current state for rollback
        id: rollback_tag
        run: |
          set -euo pipefail
          TAG="${{ steps.pre.outputs.rollback_tag }}"

          if docker image inspect "$IMAGE:$MOVING_TAG" > /dev/null 2>&1; then
            docker tag "$IMAGE:$MOVING_TAG" "$IMAGE:$TAG"
            echo "tagged $IMAGE:$MOVING_TAG -> $IMAGE:$TAG"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$IMAGE:$MOVING_TAG does not exist locally, nothing to roll back to"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # -----------------------------------------------------------------------
      # Pull exactly the pinned tag (:main-<sha> or :vX.Y.Z) and move the
      # service's tag to it. That is what makes the deploy provably equal to
      # the triggering commit.
      - name: Pull the image built from this commit
        id: pull
        run: |
          set -euo pipefail
          PULL_TAG="${{ steps.pre.outputs.pull_tag }}"

          echo "::group::pull $IMAGE:$PULL_TAG"
          docker pull "$IMAGE:$PULL_TAG"
          docker tag  "$IMAGE:$PULL_TAG" "$IMAGE:$MOVING_TAG"
          TARGET_ID=$(docker image inspect -f '{{.Id}}' "$IMAGE:$MOVING_TAG")
          echo "target image id: $TARGET_ID"
          echo "target_id=$TARGET_ID" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

      # -----------------------------------------------------------------------
      - name: Recreate the service
        id: recreate
        run: |
          set -euo pipefail
          # The window the log checks below read. A few seconds back so that
          # nothing is missed between the timestamp and the start.
          SINCE=$(date -u --date='-5 seconds' +%Y-%m-%dT%H:%M:%SZ)
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"

          compose() {
            docker compose \
              -p "$COMPOSE_PROJECT" \
              --project-directory "$COMPOSE_DIR" \
              --env-file "$COMPOSE_ENV_FILE" \
              -f "$COMPOSE_FILE_PATH" "$@"
          }

          # The Python sandbox (build123d) runs the same image as its own
          # service; recreate it first when the compose file has it, so the
          # server never talks to an older sandbox. See deploy/README.md.
          services="$SERVICE"
          if compose config --services | grep -qx "$SANDBOX_SERVICE"; then
            services="$SANDBOX_SERVICE $SERVICE"
          fi

          # --no-deps plus naming the services explicitly keeps compose away
          # from the other containers on the machine.
          compose up -d --no-deps --force-recreate $services

      # -----------------------------------------------------------------------
      # GATE: the app must say itself that it came up. server.py prints the
      # marker once uvicorn is listening on the port. Without it the deploy
      # fails - that is the difference from just looking at the container state.
      #
      # REDACTION: the Actions log for this repo is PUBLIC. The app's log
      # contains client IPs, URLs and file names the user chose, so no log
      # line is printed below. Only hit/no hit and seconds.
      - name: Startup log gate
        id: ready
        run: |
          set -uo pipefail
          SINCE="${{ steps.recreate.outputs.since }}"

          LOG=$(mktemp)
          trap 'rm -f "$LOG"' EXIT

          start=$(date +%s)
          deadline=$(( start + READY_TIMEOUT_SECONDS ))
          found=0
          sha_ok=0

          while :; do
            # To a file, not through a pipe: `grep -q` closes the pipe early and
            # then `docker logs` would die of SIGPIPE and trip pipefail.
            docker logs --since "$SINCE" "$CONTAINER" > "$LOG" 2>&1 || true

            if grep -qF "$READY_MARKER" "$LOG"; then
              found=1
              grep -qF "$READY_MARKER sha=$FULL_SHA" "$LOG" && sha_ok=1
              break
            fi
            [ "$(date +%s)" -lt "$deadline" ] || break
            sleep 2
          done

          waited=$(( $(date +%s) - start ))
          echo "waited=$waited" >> "$GITHUB_OUTPUT"

          if [ "$found" -ne 1 ]; then
            echo "::error::the startup marker did not appear in $CONTAINER within ${READY_TIMEOUT_SECONDS}s - the app did not come up"
            echo "marker=missing" >> "$GITHUB_OUTPUT"
            echo "| startup marker | **missing after ${waited}s** |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "$sha_ok" -ne 1 ]; then
            echo "::error::the startup marker was found, but not for commit $FULL_SHA - the container is running something else"
            echo "marker=wrong-sha" >> "$GITHUB_OUTPUT"
            echo "| startup marker | **found, but from a different commit** |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "startup marker found after ${waited}s, for commit $FULL_SHA"
          echo "marker=ok" >> "$GITHUB_OUTPUT"
          echo "| startup marker | found after ${waited}s |" >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------------
      - name: Wait for the service to become healthy
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 300 ))

          echo "::group::$CONTAINER"
          while :; do
            STATE=$(docker inspect -f '{{.State.Status}}' "$CONTAINER" 2>/dev/null || echo missing)
            HEALTH=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$CONTAINER" 2>/dev/null || echo none)
            echo "$CONTAINER: state=$STATE health=$HEALTH"

            if [ "$STATE" = "running" ] && { [ "$HEALTH" = "healthy" ] || [ "$HEALTH" = "none" ]; }; then
              break
            fi
            if [ "$STATE" = "exited" ] || [ "$STATE" = "dead" ] || [ "$HEALTH" = "unhealthy" ]; then
              echo "::error::$CONTAINER is $STATE/$HEALTH"
              # Deliberately NO `docker logs` here: the log for this repo is
              # public. The error summary further down is redacted instead.
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::timed out waiting for $CONTAINER (state=$STATE health=$HEALTH)"
              exit 1
            fi
            sleep 5
          done
          echo "::endgroup::"

      # -----------------------------------------------------------------------
      - name: Verify the running container is the image built from this commit
        run: |
          set -euo pipefail
          EXPECTED="${{ steps.pull.outputs.target_id }}"
          RUNNING=$(docker inspect -f '{{.Image}}' "$CONTAINER")
          echo "expected image id: $EXPECTED"
          echo "running image id:  $RUNNING"
          if [ "$RUNNING" != "$EXPECTED" ]; then
            echo "::error::$CONTAINER is running $RUNNING, not the image built from ${{ steps.pre.outputs.full_sha }}"
            exit 1
          fi
          echo "the container is provably the build of ${{ steps.pre.outputs.short_sha }}"

      # -----------------------------------------------------------------------
      - name: Verify /health answers
        run: |
          set -euo pipefail
          OUT=""
          for attempt in $(seq 1 24); do
            if OUT=$(curl -fsS --max-time 10 "$APP_URL/health"); then
              break
            fi
            echo "attempt $attempt: /health not answering yet"
            OUT=""
            sleep 5
          done
          [ -n "$OUT" ] || { echo "::error::/health never answered"; exit 1; }
          echo "health: $OUT"
          case "$OUT" in
            ok*) echo "health OK" ;;
            *) echo "::error::unexpected answer from /health"; exit 1 ;;
          esac

      # -----------------------------------------------------------------------
      # The service is on a public URL and the token is the only thing
      # protecting it. A regression that left /mcp open would be serious right
      # away: with ALLOW_SCRIPT=1 at some point in the future it is code
      # execution. So it is allowed to fail the deploy.
      - name: Verify /mcp requires a token
        run: |
          set -euo pipefail
          CODE=$(curl -o /dev/null -sS -w '%{http_code}' --max-time 10 "$APP_URL/mcp")
          echo "/mcp (no token) http=$CODE"
          [ "$CODE" = "401" ] || { echo "::error::/mcp returned $CODE without a token, expected 401"; exit 1; }

          # /files/ must also require a token as long as FILES_PUBLIC=0.
          FCODE=$(curl -o /dev/null -sS -w '%{http_code}' --max-time 10 "$APP_URL/files/does-not-exist.stl")
          echo "/files/<unknown> (no token) http=$FCODE"
          [ "$FCODE" = "401" ] || echo "::warning::/files/ returned $FCODE without a token - is FILES_PUBLIC set to 1?"

      # -----------------------------------------------------------------------
      # Positive check: with the token the MCP endpoint must answer like an MCP
      # server, not 401. The token comes from the runner's environment and is
      # never echoed.
      - name: Verify /mcp answers with a token
        run: |
          set -euo pipefail
          TOKEN="${!TOKEN_VAR}"
          CODE=$(curl -o /dev/null -sS -w '%{http_code}' --max-time 15 \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -X POST "$APP_URL/mcp" \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"deploy-check","version":"1"}}}')
          echo "/mcp initialize (with token) http=$CODE"
          # 200 = answered directly, 400/406 = got past auth but tripped over
          # protocol details. 401/403 is the only real failure here.
          case "$CODE" in
            401|403) echo "::error::the token was not accepted by /mcp (http $CODE)"; exit 1 ;;
            200) echo "the MCP endpoint answered" ;;
            *) echo "::warning::/mcp returned http $CODE with a token - past auth, but not 200" ;;
          esac

      # -----------------------------------------------------------------------
      # Error summary - REDACTED. Always runs, even when the gate above failed,
      # so that a failed deploy says something about why.
      #
      # No log line leaves the machine. The only things written are: number of
      # lines in the window, number of error lines, fixed texts for patterns we
      # recognise, and the number of error lines we could NOT classify (without
      # their content).
      - name: Summarise startup errors (redacted)
        if: always()
        run: |
          set -uo pipefail
          SINCE="${{ steps.recreate.outputs.since }}"
          [ -n "$SINCE" ] || SINCE="15m"

          LOG=$(mktemp)
          HITS=$(mktemp)
          trap 'rm -f "$LOG" "$HITS"' EXIT
          docker logs --since "$SINCE" "$CONTAINER" > "$LOG" 2>&1 || true

          TOTAL=$(wc -l < "$LOG" | tr -d ' ')
          # uvicorn/python: ERROR/CRITICAL lines and tracebacks.
          ERRORS=$(grep -Ec '\b(ERROR|CRITICAL)\b|Traceback \(most recent call last\)' "$LOG" || true)
          ERRORS=${ERRORS:-0}

          # Allowlist: patterns we dare report on, and the FIXED text written
          # instead of the line itself. Only add patterns whose text cannot
          # contain user data, paths or addresses.
          PATTERNS=(
            'ModuleNotFoundError|ImportError'
            'Address already in use|EADDRINUSE'
            'Permission denied'
            'No space left on device'
            'Errno 13'
            'MemoryError|Killed'
          )
          LABELS=(
            'a python module is missing from the image'
            'the port was already in use'
            'permission denied (probably /data permissions)'
            'the disk is full'
            'permission denied while writing a file'
            'the process died of memory exhaustion'
          )

          classified=0
          i=0
          while [ "$i" -lt "${#PATTERNS[@]}" ]; do
            n=$(grep -Ec "${PATTERNS[$i]}" "$LOG" || true)
            n=${n:-0}
            if [ "$n" -gt 0 ]; then
              classified=$(( classified + n ))
              printf -- '- %s: %s\n' "${LABELS[$i]}" "$n" >> "$HITS"
            fi
            i=$(( i + 1 ))
          done

          unknown=$(( ERRORS - classified ))
          [ "$unknown" -ge 0 ] || unknown=0

          echo "log lines in the window: $TOTAL"
          echo "error lines: $ERRORS (classified: $classified, unclassified: $unknown)"

          {
            echo ""
            echo "#### Startup log"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| log lines in the window | $TOTAL |"
            echo "| error lines | $ERRORS |"
            echo ""
            if [ -s "$HITS" ]; then
              echo "Known errors:"
              echo ""
              cat "$HITS"
              echo ""
            fi
            if [ "$unknown" -gt 0 ]; then
              echo "$unknown error line(s) matched no known pattern and are NOT shown here - the log for this repo is public. Read them on tillyse with:"
              echo ""
              echo '```bash'
              echo "docker logs --since $SINCE $CONTAINER"
              echo '```'
            fi
            if [ "$ERRORS" -eq 0 ]; then
              echo "No error lines in the startup window."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------------
      - name: Roll back on failure
        if: failure() && steps.rollback_tag.outputs.available == 'true'
        run: |
          set -uo pipefail
          TAG="${{ steps.pre.outputs.rollback_tag }}"
          echo "::warning::rolling $IMAGE:$MOVING_TAG back to $IMAGE:$TAG"

          docker tag "$IMAGE:$TAG" "$IMAGE:$MOVING_TAG" || { echo "::error::retag failed"; exit 1; }
          docker compose \
            -p "$COMPOSE_PROJECT" \
            --project-directory "$COMPOSE_DIR" \
            --env-file "$COMPOSE_ENV_FILE" \
            -f "$COMPOSE_FILE_PATH" \
            up -d --no-deps --force-recreate \
            "$SERVICE" || { echo "::error::rollback recreate failed - $SERVICE may be down"; exit 1; }

          for attempt in $(seq 1 24); do
            if OUT=$(curl -fsS --max-time 10 "$APP_URL/health"); then
              echo "rolled back, now answering: $OUT"
              exit 0
            fi
            sleep 5
          done
          echo "::error::rolled back but $SERVICE does not answer on /health"
          exit 1

      # -----------------------------------------------------------------------
      - name: Summary
        if: success()
        run: |
          {
            echo ""
            echo "The deploy succeeded. All checks passed."
            echo ""
            if [ "$TARGET" = "prod" ]; then
              echo "Roll back: run the **Release** workflow by hand with an older version."
              echo ""
            fi
            echo "Roll back manually, on tillyse:"
            echo '```bash'
            echo "docker tag $IMAGE:${{ steps.pre.outputs.rollback_tag }} $IMAGE:$MOVING_TAG"
            echo "cd /config && docker compose -p config --env-file /config/stl-mcp-runner/compose.env \\"
            echo "  -f /config/docker-compose.yml up -d --no-deps --force-recreate $SERVICE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------------
      - name: Notify ntfy on success
        if: success()
        env:
          # The commit message is text someone else can control. It goes via
          # the environment and is only referenced as "$COMMIT_MESSAGE", so it
          # cannot be interpolated into the script and executed.
          COMMIT_MESSAGE: ${{ inputs.target == 'prod' && needs.promote.outputs.subject || inputs.commit_message }}
        run: |
          set -uo pipefail

          SHORT="${{ steps.pre.outputs.short_sha }}"
          STARTED="${{ steps.pre.outputs.started_epoch }}"

          SUBJECT=$(printf '%s' "$COMMIT_MESSAGE" | head -n 1 | cut -c1-120)
          [ -n "$SUBJECT" ] || SUBJECT="(no commit message)"

          if [ -n "$STARTED" ]; then
            D=$(( $(date +%s) - STARTED ))
            if [ "$D" -ge 60 ]; then DUR="$(( D / 60 ))m $(( D % 60 ))s"; else DUR="${D}s"; fi
          else
            DUR="unknown"
          fi

          BODY=$(printf '%s\n' \
            "$SUBJECT" \
            "Restarted: $SERVICE" \
            "Time: $DUR")

          if [ -z "${NTFY_TOKEN:-}" ]; then
            echo "::error::NTFY_TOKEN is missing - could not send the notification"
            exit 1
          fi

          curl -s -H "Authorization: Bearer $NTFY_TOKEN" \
               -H "Title: $SERVICE deployed: ${VERSION:-$SHORT}" \
               -H "Priority: default" \
               -H "Tags: white_check_mark" \
               -d "$BODY" \
               "$NTFY_URL" > /dev/null \
            && echo "ntfy notification sent" \
            || echo "::warning::the ntfy notification could not be sent"

      # -----------------------------------------------------------------------
      - name: Notify ntfy on failure
        if: failure()
        run: |
          set -uo pipefail
          TAG="${{ steps.pre.outputs.rollback_tag }}"
          SHORT="${{ steps.pre.outputs.short_sha }}"
          ROLLED="${{ steps.rollback_tag.outputs.available == 'true' && 'yes (automatic)' || 'no - no rollback image existed' }}"

          BODY=$(printf '%s\n' \
            "The $SERVICE deploy failed on tillyse ($(date '+%Y-%m-%d %H:%M'))." \
            "Commit: ${SHORT:-unknown}" \
            "Rollback tag: ${TAG:-none created}" \
            "Restored: $ROLLED" \
            "Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")

          [ -n "${NTFY_TOKEN:-}" ] || { echo "::error::NTFY_TOKEN is missing"; exit 0; }

          curl -s -H "Authorization: Bearer $NTFY_TOKEN" \
               -H "Title: $SERVICE deploy FAILED" \
               -H "Priority: high" \
               -H "Tags: warning" \
               -d "$BODY" \
               "$NTFY_URL" > /dev/null \
            && echo "ntfy failure notification sent" \
            || echo "::warning::the ntfy failure notification could not be sent"
