# Testar och deployar stl-mcp till tilly.se-servern via en self-hosted runner (label "tillyse").
#
# Engångsinstallation på servern: deploy/setup-runner.sh (se deploy/README.md).
# Repo-inställningar:
#   Secrets:   MCP_TOKEN                  (krävs)
#   Variables: PUBLIC_URL                 t.ex. https://stl.tilly.se
#              DOMAIN                     t.ex. stl.tilly.se – sätts bara om inbyggd Caddy (HTTPS) ska användas
#              UI_PUBLIC / FILES_PUBLIC   0/1 (valfria)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Inga pull_request-triggers: self-hosted runnern ska aldrig köra kod från forkar.
permissions:
  contents: read

concurrency:
  group: deploy-tillyse
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Röktest (MCP + webb)
        env:
          MCP_TOKEN: citoken
          STL_DIR: ${{ runner.temp }}/data
        run: |
          python server.py > server.log 2>&1 &
          for i in $(seq 1 40); do curl -sf localhost:8765/health && break; sleep 0.5; done
          cd "$RUNNER_TEMP" && python "$GITHUB_WORKSPACE/test_client.py"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8765/api/models)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer citoken' localhost:8765/api/models)" = 200
      - if: failure()
        run: cat server.log

  deploy:
    needs: test
    runs-on: [self-hosted, tillyse]
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploya
        env:
          MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          DOMAIN: ${{ vars.DOMAIN }}
          UI_PUBLIC: ${{ vars.UI_PUBLIC }}
          FILES_PUBLIC: ${{ vars.FILES_PUBLIC }}
        run: deploy/deploy.sh
