name: Deploy to tillyse

# Runs on the self-hosted runner (stl-mcp-runner) on tillyse after
# "Build and Push Docker Image" has pushed a new image for a push to main.
#
# The runner talks to Docker through kraftmon-docker-proxy, which has BUILD=0
# and EXEC=0: this job CANNOT build anything on tillyse and cannot exec into any
# container. It can only pull an already published image from ghcr.io and
# recreate the single service `stl-mcp` - it never touches the other ~60
# containers on the machine.
#
# The repo is PUBLIC, so the gates below are what keep fork code off the
# machine: the job requires a successful build of a push to main in this repo,
# AND that the account behind the build is listed in ALLOWED_ACTORS in the
# gate job.
#
# Every compose call below passes --env-file "$COMPOSE_ENV_FILE". The runner
# cannot see /config/.env, so without that flag ${TZ} etc. would be empty when
# compose reads the file.

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-stl-mcp-tillyse
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Gate. Runs on GitHub's own runner, i.e. BEFORE anything at all may land on
  # tillyse. If it does not let the run through, the self-hosted runner never
  # starts.
  gate:
    name: Check who triggered this
    runs-on: ubuntu-latest

    # Only a successful build, of a push (not a PR), to main, in this repo
    # (not a fork).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    outputs:
      allowed: ${{ steps.check.outputs.allowed }}

    env:
      # =====================================================================
      # WHICH ACCOUNTS MAY DEPLOY TO TILLYSE
      # Space-separated GitHub usernames. Add more here.
      # Empty list = no deploy happens at all.
      ALLOWED_ACTORS: "htilly"
      # =====================================================================

      # actor = whoever started the build. triggering_actor = whoever started
      # this particular run attempt, which differs on a re-run. Both must be in
      # the list, otherwise someone else could re-run your build and deploy.
      RUN_ACTOR: ${{ github.event.workflow_run.actor.login }}
      RERUN_ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}

    steps:
      - name: Match actor against the allowlist
        id: check
        run: |
          set -euo pipefail

          allowed=true
          for who in "$RUN_ACTOR" "$RERUN_ACTOR"; do
            if [ -z "$who" ]; then
              echo "::warning::empty username - no deploy"
              allowed=false
              continue
            fi
            case " $ALLOWED_ACTORS " in
              *" $who "*) echo "ok: $who is in ALLOWED_ACTORS" ;;
              *) echo "::warning::$who is NOT in ALLOWED_ACTORS - no deploy"; allowed=false ;;
            esac
          done

          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          {
            echo "### Gate"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| started the build | \`$RUN_ACTOR\` |"
            echo "| started the run | \`$RERUN_ACTOR\` |"
            echo "| allowed accounts | \`$ALLOWED_ACTORS\` |"
            echo "| deploy | \`$allowed\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy stl-mcp to tillyse
    needs: gate
    if: >-
      needs.gate.outputs.allowed == 'true' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, stl-mcp]

    # Second gate, on GitHub's side and independent of the YAML expressions
    # above: the tillyse environment only admits runs from main.
    environment: tillyse

    env:
      IMAGE: ghcr.io/htilly/stl-mcp
      SERVICE: stl-mcp
      CONTAINER: stl-mcp
      COMPOSE_PROJECT: config
      COMPOSE_DIR: /config
      # The runner shares config_default with the app and reaches it on the
      # container port (8765), not the host's 127.0.0.1:8892.
      APP_URL: http://stl-mcp:8765
      # The startup marker the app prints once it is actually up (server.py).
      # If it changes in one place it must change in both.
      READY_MARKER: STL_MCP_READY
      READY_TIMEOUT_SECONDS: "120"
      # DOCKER_HOST, NTFY_URL, NTFY_TOKEN, MCP_TOKEN, COMPOSE_FILE_PATH and
      # COMPOSE_ENV_FILE come from the runner's container environment (see
      # /config/docker-compose.yml and /config/secrets/stl-mcp-runner.env on
      # tillyse). MCP_TOKEN only lives there - never in this repo.

    steps:
      # -----------------------------------------------------------------------
      - name: Preflight
        id: pre
        run: |
          set -euo pipefail

          fail=0
          for v in DOCKER_HOST NTFY_URL NTFY_TOKEN MCP_TOKEN COMPOSE_FILE_PATH COMPOSE_ENV_FILE; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v is not set in the runner's environment"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

          test -r "$COMPOSE_FILE_PATH" || { echo "::error::cannot read $COMPOSE_FILE_PATH"; exit 1; }
          test -r "$COMPOSE_ENV_FILE"  || { echo "::error::cannot read $COMPOSE_ENV_FILE"; exit 1; }
          docker version --format '{{.Server.Version}}' > /dev/null \
            || { echo "::error::cannot reach the socket proxy at $DOCKER_HOST"; exit 1; }

          # The compose file must actually point the service at the tag we deploy.
          if ! grep -qE "^\s+image:\s+${IMAGE}:main\s*$" "$COMPOSE_FILE_PATH"; then
            echo "::error::$COMPOSE_FILE_PATH does not point $SERVICE at ${IMAGE}:main"
            exit 1
          fi

          FULL_SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA="${FULL_SHA:0:7}"
          STAMP="$(date +%Y%m%d-%H%M%S)"

          echo "full_sha=$FULL_SHA"           >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA"         >> "$GITHUB_OUTPUT"
          echo "rollback_tag=rollback-$STAMP" >> "$GITHUB_OUTPUT"
          echo "started_epoch=$(date +%s)"    >> "$GITHUB_OUTPUT"

          {
            echo "### Deploy stl-mcp to tillyse"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`$FULL_SHA\` |"
            echo "| image | \`${IMAGE}:main-$SHORT_SHA\` |"
            echo "| rollback tag | \`rollback-$STAMP\` |"
            echo "| build | [#${{ github.event.workflow_run.run_number }}](${{ github.event.workflow_run.html_url }}) |"
          } >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------------
      - name: Capture current state for rollback
        id: rollback_tag
        run: |
          set -euo pipefail
          TAG="${{ steps.pre.outputs.rollback_tag }}"

          if docker image inspect "$IMAGE:main" > /dev/null 2>&1; then
            docker tag "$IMAGE:main" "$IMAGE:$TAG"
            echo "tagged $IMAGE:main -> $IMAGE:$TAG"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$IMAGE:main does not exist locally, nothing to roll back to"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # -----------------------------------------------------------------------
      # Pull exactly the sha-pinned tag the build pushed and move :main to it.
      # That is what makes the deploy provably equal to the triggering commit.
      - name: Pull the image built from this commit
        id: pull
        run: |
          set -euo pipefail
          SHORT="${{ steps.pre.outputs.short_sha }}"

          echo "::group::pull $IMAGE:main-$SHORT"
          docker pull "$IMAGE:main-$SHORT"
          docker tag  "$IMAGE:main-$SHORT" "$IMAGE:main"
          TARGET=$(docker image inspect -f '{{.Id}}' "$IMAGE:main")
          echo "target image id: $TARGET"
          echo "target_id=$TARGET" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

      # -----------------------------------------------------------------------
      - name: Recreate stl-mcp
        id: recreate
        run: |
          set -euo pipefail
          # The window the log checks below read. A few seconds back so that
          # nothing is missed between the timestamp and the start.
          SINCE=$(date -u --date='-5 seconds' +%Y-%m-%dT%H:%M:%SZ)
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"

          # --no-deps plus naming the service explicitly keeps compose away
          # from the other containers on the machine.
          docker compose \
            -p "$COMPOSE_PROJECT" \
            --project-directory "$COMPOSE_DIR" \
            --env-file "$COMPOSE_ENV_FILE" \
            -f "$COMPOSE_FILE_PATH" \
            up -d --no-deps --force-recreate \
            "$SERVICE"

      # -----------------------------------------------------------------------
      # GATE: the app must say itself that it came up. server.py prints the
      # marker once uvicorn is listening on the port. Without it the deploy
      # fails - that is the difference from just looking at the container state.
      #
      # REDACTION: the Actions log for this repo is PUBLIC. The app's log
      # contains client IPs, URLs and file names the user chose, so no log
      # line is printed below. Only hit/no hit and seconds.
      - name: Startup log gate
        id: ready
        run: |
          set -uo pipefail
          SINCE="${{ steps.recreate.outputs.since }}"
          FULL_SHA="${{ steps.pre.outputs.full_sha }}"

          LOG=$(mktemp)
          trap 'rm -f "$LOG"' EXIT

          start=$(date +%s)
          deadline=$(( start + READY_TIMEOUT_SECONDS ))
          found=0
          sha_ok=0

          while :; do
            # To a file, not through a pipe: `grep -q` closes the pipe early and
            # then `docker logs` would die of SIGPIPE and trip pipefail.
            docker logs --since "$SINCE" "$CONTAINER" > "$LOG" 2>&1 || true

            if grep -qF "$READY_MARKER" "$LOG"; then
              found=1
              grep -qF "$READY_MARKER sha=$FULL_SHA" "$LOG" && sha_ok=1
              break
            fi
            [ "$(date +%s)" -lt "$deadline" ] || break
            sleep 2
          done

          waited=$(( $(date +%s) - start ))
          echo "waited=$waited" >> "$GITHUB_OUTPUT"

          if [ "$found" -ne 1 ]; then
            echo "::error::the startup marker did not appear in $CONTAINER within ${READY_TIMEOUT_SECONDS}s - the app did not come up"
            echo "marker=missing" >> "$GITHUB_OUTPUT"
            echo "| startup marker | **missing after ${waited}s** |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "$sha_ok" -ne 1 ]; then
            echo "::error::the startup marker was found, but not for commit $FULL_SHA - the container is running something else"
            echo "marker=wrong-sha" >> "$GITHUB_OUTPUT"
            echo "| startup marker | **found, but from a different commit** |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "startup marker found after ${waited}s, for commit $FULL_SHA"
          echo "marker=ok" >> "$GITHUB_OUTPUT"
          echo "| startup marker | found after ${waited}s |" >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------------
      - name: Wait for stl-mcp to become healthy
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 300 ))

          echo "::group::$CONTAINER"
          while :; do
            STATE=$(docker inspect -f '{{.State.Status}}' "$CONTAINER" 2>/dev/null || echo missing)
            HEALTH=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$CONTAINER" 2>/dev/null || echo none)
            echo "$CONTAINER: state=$STATE health=$HEALTH"

            if [ "$STATE" = "running" ] && { [ "$HEALTH" = "healthy" ] || [ "$HEALTH" = "none" ]; }; then
              break
            fi
            if [ "$STATE" = "exited" ] || [ "$STATE" = "dead" ] || [ "$HEALTH" = "unhealthy" ]; then
              echo "::error::$CONTAINER is $STATE/$HEALTH"
              # Deliberately NO `docker logs` here: the log for this repo is
              # public. The error summary further down is redacted instead.
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::timed out waiting for $CONTAINER (state=$STATE health=$HEALTH)"
              exit 1
            fi
            sleep 5
          done
          echo "::endgroup::"

      # -----------------------------------------------------------------------
      - name: Verify the running container is the image built from this commit
        run: |
          set -euo pipefail
          EXPECTED="${{ steps.pull.outputs.target_id }}"
          RUNNING=$(docker inspect -f '{{.Image}}' "$CONTAINER")
          echo "expected image id: $EXPECTED"
          echo "running image id:  $RUNNING"
          if [ "$RUNNING" != "$EXPECTED" ]; then
            echo "::error::$CONTAINER is running $RUNNING, not the image built from ${{ steps.pre.outputs.full_sha }}"
            exit 1
          fi
          echo "the container is provably the build of ${{ steps.pre.outputs.short_sha }}"

      # -----------------------------------------------------------------------
      - name: Verify /health answers
        run: |
          set -euo pipefail
          OUT=""
          for attempt in $(seq 1 24); do
            if OUT=$(curl -fsS --max-time 10 "$APP_URL/health"); then
              break
            fi
            echo "attempt $attempt: /health not answering yet"
            OUT=""
            sleep 5
          done
          [ -n "$OUT" ] || { echo "::error::/health never answered"; exit 1; }
          echo "health: $OUT"
          case "$OUT" in
            ok*) echo "health OK" ;;
            *) echo "::error::unexpected answer from /health"; exit 1 ;;
          esac

      # -----------------------------------------------------------------------
      # The service is on a public URL and the token is the only thing
      # protecting it. A regression that left /mcp open would be serious right
      # away: with ALLOW_SCRIPT=1 at some point in the future it is code
      # execution. So it is allowed to fail the deploy.
      - name: Verify /mcp requires a token
        run: |
          set -euo pipefail
          CODE=$(curl -o /dev/null -sS -w '%{http_code}' --max-time 10 "$APP_URL/mcp")
          echo "/mcp (no token) http=$CODE"
          [ "$CODE" = "401" ] || { echo "::error::/mcp returned $CODE without a token, expected 401"; exit 1; }

          # /files/ must also require a token as long as FILES_PUBLIC=0.
          FCODE=$(curl -o /dev/null -sS -w '%{http_code}' --max-time 10 "$APP_URL/files/does-not-exist.stl")
          echo "/files/<unknown> (no token) http=$FCODE"
          [ "$FCODE" = "401" ] || echo "::warning::/files/ returned $FCODE without a token - is FILES_PUBLIC set to 1?"

      # -----------------------------------------------------------------------
      # Positive check: with the token the MCP endpoint must answer like an MCP
      # server, not 401. The token comes from the runner's environment and is
      # never echoed.
      - name: Verify /mcp answers with a token
        run: |
          set -euo pipefail
          CODE=$(curl -o /dev/null -sS -w '%{http_code}' --max-time 15 \
            -H "Authorization: Bearer $MCP_TOKEN" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -X POST "$APP_URL/mcp" \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"deploy-check","version":"1"}}}')
          echo "/mcp initialize (with token) http=$CODE"
          # 200 = answered directly, 400/406 = got past auth but tripped over
          # protocol details. 401/403 is the only real failure here.
          case "$CODE" in
            401|403) echo "::error::the token was not accepted by /mcp (http $CODE)"; exit 1 ;;
            200) echo "the MCP endpoint answered" ;;
            *) echo "::warning::/mcp returned http $CODE with a token - past auth, but not 200" ;;
          esac

      # -----------------------------------------------------------------------
      # Error summary - REDACTED. Always runs, even when the gate above failed,
      # so that a failed deploy says something about why.
      #
      # No log line leaves the machine. The only things written are: number of
      # lines in the window, number of error lines, fixed texts for patterns we
      # recognise, and the number of error lines we could NOT classify (without
      # their content).
      - name: Summarise startup errors (redacted)
        if: always()
        run: |
          set -uo pipefail
          SINCE="${{ steps.recreate.outputs.since }}"
          [ -n "$SINCE" ] || SINCE="15m"

          LOG=$(mktemp)
          HITS=$(mktemp)
          trap 'rm -f "$LOG" "$HITS"' EXIT
          docker logs --since "$SINCE" "$CONTAINER" > "$LOG" 2>&1 || true

          TOTAL=$(wc -l < "$LOG" | tr -d ' ')
          # uvicorn/python: ERROR/CRITICAL lines and tracebacks.
          ERRORS=$(grep -Ec '\b(ERROR|CRITICAL)\b|Traceback \(most recent call last\)' "$LOG" || true)
          ERRORS=${ERRORS:-0}

          # Allowlist: patterns we dare report on, and the FIXED text written
          # instead of the line itself. Only add patterns whose text cannot
          # contain user data, paths or addresses.
          PATTERNS=(
            'ModuleNotFoundError|ImportError'
            'Address already in use|EADDRINUSE'
            'Permission denied'
            'No space left on device'
            'Errno 13'
            'MemoryError|Killed'
          )
          LABELS=(
            'a python module is missing from the image'
            'the port was already in use'
            'permission denied (probably /data permissions)'
            'the disk is full'
            'permission denied while writing a file'
            'the process died of memory exhaustion'
          )

          classified=0
          i=0
          while [ "$i" -lt "${#PATTERNS[@]}" ]; do
            n=$(grep -Ec "${PATTERNS[$i]}" "$LOG" || true)
            n=${n:-0}
            if [ "$n" -gt 0 ]; then
              classified=$(( classified + n ))
              printf -- '- %s: %s\n' "${LABELS[$i]}" "$n" >> "$HITS"
            fi
            i=$(( i + 1 ))
          done

          unknown=$(( ERRORS - classified ))
          [ "$unknown" -ge 0 ] || unknown=0

          echo "log lines in the window: $TOTAL"
          echo "error lines: $ERRORS (classified: $classified, unclassified: $unknown)"

          {
            echo ""
            echo "#### Startup log"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| log lines in the window | $TOTAL |"
            echo "| error lines | $ERRORS |"
            echo ""
            if [ -s "$HITS" ]; then
              echo "Known errors:"
              echo ""
              cat "$HITS"
              echo ""
            fi
            if [ "$unknown" -gt 0 ]; then
              echo "$unknown error line(s) matched no known pattern and are NOT shown here - the log for this repo is public. Read them on tillyse with:"
              echo ""
              echo '```bash'
              echo "docker logs --since $SINCE stl-mcp"
              echo '```'
            fi
            if [ "$ERRORS" -eq 0 ]; then
              echo "No error lines in the startup window."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------------
      - name: Roll back on failure
        if: failure() && steps.rollback_tag.outputs.available == 'true'
        run: |
          set -uo pipefail
          TAG="${{ steps.pre.outputs.rollback_tag }}"
          echo "::warning::rolling $IMAGE:main back to $IMAGE:$TAG"

          docker tag "$IMAGE:$TAG" "$IMAGE:main" || { echo "::error::retag failed"; exit 1; }
          docker compose \
            -p "$COMPOSE_PROJECT" \
            --project-directory "$COMPOSE_DIR" \
            --env-file "$COMPOSE_ENV_FILE" \
            -f "$COMPOSE_FILE_PATH" \
            up -d --no-deps --force-recreate \
            "$SERVICE" || { echo "::error::rollback recreate failed - stl-mcp may be down"; exit 1; }

          for attempt in $(seq 1 24); do
            if OUT=$(curl -fsS --max-time 10 "$APP_URL/health"); then
              echo "rolled back, now answering: $OUT"
              exit 0
            fi
            sleep 5
          done
          echo "::error::rolled back but stl-mcp does not answer on /health"
          exit 1

      # -----------------------------------------------------------------------
      - name: Summary
        if: success()
        run: |
          {
            echo ""
            echo "The deploy succeeded. All checks passed."
            echo ""
            echo "Roll back manually, on tillyse:"
            echo '```bash'
            echo "docker tag $IMAGE:${{ steps.pre.outputs.rollback_tag }} $IMAGE:main"
            echo "cd /config && docker compose -p config --env-file /config/stl-mcp-runner/compose.env \\"
            echo "  -f /config/docker-compose.yml up -d --no-deps --force-recreate stl-mcp"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------------
      - name: Notify ntfy on success
        if: success()
        env:
          # The commit message is text someone else can control. It goes via
          # the environment and is only referenced as "$COMMIT_MESSAGE", so it
          # cannot be interpolated into the script and executed.
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          set -uo pipefail

          SHORT="${{ steps.pre.outputs.short_sha }}"
          STARTED="${{ steps.pre.outputs.started_epoch }}"

          SUBJECT=$(printf '%s' "$COMMIT_MESSAGE" | head -n 1 | cut -c1-120)
          [ -n "$SUBJECT" ] || SUBJECT="(no commit message)"

          if [ -n "$STARTED" ]; then
            D=$(( $(date +%s) - STARTED ))
            if [ "$D" -ge 60 ]; then DUR="$(( D / 60 ))m $(( D % 60 ))s"; else DUR="${D}s"; fi
          else
            DUR="unknown"
          fi

          BODY=$(printf '%s\n' \
            "$SUBJECT" \
            "Restarted: stl-mcp" \
            "Time: $DUR")

          if [ -z "${NTFY_TOKEN:-}" ]; then
            echo "::error::NTFY_TOKEN is missing - could not send the notification"
            exit 1
          fi

          curl -s -H "Authorization: Bearer $NTFY_TOKEN" \
               -H "Title: stl-mcp deployed: $SHORT" \
               -H "Priority: default" \
               -H "Tags: white_check_mark" \
               -d "$BODY" \
               "$NTFY_URL" > /dev/null \
            && echo "ntfy notification sent" \
            || echo "::warning::the ntfy notification could not be sent"

      # -----------------------------------------------------------------------
      - name: Notify ntfy on failure
        if: failure()
        run: |
          set -uo pipefail
          TAG="${{ steps.pre.outputs.rollback_tag }}"
          SHORT="${{ steps.pre.outputs.short_sha }}"
          ROLLED="${{ steps.rollback_tag.outputs.available == 'true' && 'yes (automatic)' || 'no - no rollback image existed' }}"

          BODY=$(printf '%s\n' \
            "The stl-mcp deploy failed on tillyse ($(date '+%Y-%m-%d %H:%M'))." \
            "Commit: ${SHORT:-unknown}" \
            "Rollback tag: ${TAG:-none created}" \
            "Restored: $ROLLED" \
            "Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")

          [ -n "${NTFY_TOKEN:-}" ] || { echo "::error::NTFY_TOKEN is missing"; exit 0; }

          curl -s -H "Authorization: Bearer $NTFY_TOKEN" \
               -H "Title: stl-mcp deploy FAILED" \
               -H "Priority: high" \
               -H "Tags: warning" \
               -d "$BODY" \
               "$NTFY_URL" > /dev/null \
            && echo "ntfy failure notification sent" \
            || echo "::warning::the ntfy failure notification could not be sent"
