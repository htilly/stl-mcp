name: Build and Push Docker Image

# Builds the image (python:3.12-slim + trimesh/manifold3d, see the Dockerfile in
# the repo root) on a GitHub-hosted runner and pushes it to ghcr.io.
#
# WHY no self-hosted runner here: this repo is PUBLIC. A runner on tillyse would
# let a fork PR run arbitrary code on the server. The build therefore always
# happens at GitHub, and tillyse only PULLS the finished image - see
# .github/workflows/deploy.yml and the comment at stl-mcp in
# /config/docker-compose.yml on tillyse.
#
# Roll back by pointing the server at a :main-<sha> tag instead.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: stl-mcp

jobs:
  # A red test suite fails this workflow, and deploy.yml only deploys after a
  # successful run of it - so nothing that fails the tests reaches tillyse.
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest

  build:
    name: Build and push to ghcr.io
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Enough to push to ghcr.io for this repo. GITHUB_TOKEN is created
      # automatically per run, so no PAT needs to be created or stored.
      packages: write

    steps:
      - name: Checkout the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # No QEMU and no matrix: linux/amd64 only. ubuntu-latest is amd64 and
      # tillyse is x86_64, so arm64 would only cost build time.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Determine Docker tags
        id: docker_tags
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          # ghcr requires a lowercase image name.
          IMAGE="ghcr.io/$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')/${IMAGE_NAME}"
          echo "tags=${IMAGE}:main,${IMAGE}:main-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          # GIT_SHA is baked into the image as ENV and printed in the startup
          # marker by server.py. The deploy job requires the marker to match
          # exactly the commit that was built - without this build-arg every
          # deploy fails.
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ steps.docker_tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
