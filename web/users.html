<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Users · autosmith</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/static/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png">
<link rel="manifest" href="/static/brand/site.webmanifest">
<meta name="theme-color" content="#0f172a">
<meta property="og:site_name" content="autosmith.eu">
<meta property="og:title" content="autosmith: STL, made by AI">
<meta property="og:image" content="/static/brand/og-image.png">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/theme.js"></script>
</head>
<body>
<header class="top">
  <a class="wordmark" href="/" title="Back to the library"><svg class="i" aria-hidden="true"><use href="/static/icons.svg#i-mark"/></svg><span class="name">auto<b>smith</b></span></a>
  <span class="crumb admin-crumb"><b>Admin</b></span>
  <div class="grow"></div>
  <div data-usermenu></div>
</header>
<div class="subnav">
  <nav class="tabs" aria-label="Admin pages">
    <a href="/admin"><svg class="i" aria-hidden="true"><use href="/static/icons.svg#i-settings"/></svg>Print check</a>
    <a href="/admin/users" aria-current="page"><svg class="i" aria-hidden="true"><use href="/static/icons.svg#i-user"/></svg>Users</a>
    <a href="/admin/load"><svg class="i" aria-hidden="true"><use href="/static/icons.svg#i-gauge"/></svg>Load</a>
    <a href="/admin/design"><svg class="i" aria-hidden="true"><use href="/static/icons.svg#i-swatch"/></svg>Design system</a>
  </nav>
</div>
<main class="admin">
  <h1>Users</h1>
  <p class="msg" id="summary"></p>
  <div class="row"><label class="search grow"><svg class="i" aria-hidden="true"><use href="/static/icons.svg#i-search"/></svg>
    <input type="search" id="q" placeholder="Search name or email" autocomplete="off" aria-label="Search users"></label></div>
  <div id="users"></div>
  <p class="msg" id="msg"></p>
</main>
<script type="module">
import { api, ago, esc } from "/static/common.js";

const $ = (id) => document.getElementById(id);
const say = (t, err) => { $("msg").textContent = t; $("msg").className = "msg" + (err ? " err" : ""); };
let users = [], me = null;
const history = new Map();  // user id -> recent logins, for the users whose list is open

const flag = (cc) => String.fromCodePoint(...[...cc.toUpperCase()].map((c) => 127397 + c.charCodeAt(0)));
const country = (cc) => {
  try { return `${flag(cc)} ${new Intl.DisplayNames(["en"], { type: "region" }).of(cc.toUpperCase())}`; }
  catch { return cc; }
};
const dur = (s) => {
  if (s < 60) return s ? "<1 min" : "0";
  const m = Math.round(s / 60);
  return m < 60 ? `${m} min` : m < 2880 ? `${(m / 60).toFixed(1).replace(/\.0$/, "")} h` : `${Math.round(m / 1440)} days`;
};

function draw() {
  const term = $("q").value.trim().toLowerCase();
  const list = users.filter((u) => !term || `${u.display_name} ${u.email || ""}`.toLowerCase().includes(term));
  const admins = users.filter((u) => u.role === "admin").length;
  const byCountry = {};
  users.forEach((u) => u.countries.slice(0, 1).forEach((c) => { byCountry[c] = (byCountry[c] || 0) + 1; }));
  const top = Object.entries(byCountry).sort((a, b) => b[1] - a[1]).map(([c, n]) => `${country(c)} ${n}`).join(" · ");
  $("summary").textContent = `${users.length} users, ${admins} admin${admins === 1 ? "" : "s"}. ` +
    (signup ? "Signup is open." : "Signup is closed (SIGNUP=0).") + (top ? ` Last login from: ${top}.` : "");
  $("users").innerHTML = list.map((u) => {
    const self = me && u.id === me.id;
    const locked = u.bootstrap || self;
    const ways = [u.bootstrap ? "server token" : "", u.passkeys ? `${u.passkeys} passkey${u.passkeys === 1 ? "" : "s"} (${(u.passkey_names || []).join(", ")})` : "",
      ...u.providers].filter(Boolean).join(", ") || "no way to log in";
    return `<section class="group user${u.disabled ? " off" : ""}" data-id="${esc(u.id)}">
      <h2>${esc(u.display_name || "(no name)")}
        ${u.role === "admin" ? '<span class="pill">admin</span>' : ""}
        ${u.bootstrap ? '<span class="pill">bootstrap</span>' : ""}
        ${u.disabled ? '<span class="pill">disabled</span>' : ""}
        ${self ? '<span class="pill">you</span>' : ""}</h2>
      <p class="help">${esc(u.email || "no email")} · joined ${ago(u.created)} · ${u.last_login ? `last login ${ago(u.last_login)}` : "never logged in"}</p>
      <dl class="tb full">
        <div><dt>Models</dt><dd>${u.models}</dd></div>
        <div><dt>Storage</dt><dd>${u.disk_mb} MB</dd></div>
        <div><dt>Logs in with</dt><dd title="${esc(ways)}">${esc(ways)}</dd></div>
        <div><dt>Apps · tokens</dt><dd>${u.apps} · ${u.tokens}</dd></div>
        <div><dt>Logins</dt><dd>${u.logins}</dd></div>
        <div><dt>Time logged in</dt><dd title="Sum of login to last activity, approximate">${dur(u.seconds)}</dd></div>
        <div><dt>Country</dt><dd title="${esc(u.countries.map(country).join(", "))}">${u.countries.length ? esc(u.countries.map(country).join(", ")) : "unknown"}</dd></div>
      </dl>
      <div class="row acts">
        <button class="sm" data-act="role" data-role="${u.role === "admin" ? "member" : "admin"}" ${u.role === "admin" && locked ? "disabled" : ""}>
          ${u.role === "admin" ? "Make member" : "Make admin"}</button>
        <button class="sm" data-act="${u.disabled ? "enable" : "disable"}" ${locked ? "disabled" : ""}>${u.disabled ? "Enable" : "Disable"}</button>
        <button class="sm" data-act="logout" title="End all sessions and revoke connected apps and tokens">Log out everywhere</button>
        <button class="sm" data-act="logins" aria-expanded="${history.has(u.id)}" ${u.logins ? "" : "disabled"}>${history.has(u.id) ? "Hide logins" : "Recent logins"}</button>
        <div class="grow"></div>
        <button class="sm danger" data-act="delete" ${locked ? "disabled" : ""}>Delete</button>
      </div>${history.has(u.id) ? logins(history.get(u.id)) : ""}</section>`;
  }).join("") || `<p class="msg">No users match.</p>`;
}

function logins(rows) {
  return `<ul class="help logins">${rows.map((r) => `<li>${ago(r.at)} · ${r.country ? esc(country(r.country)) : "unknown country"}
    · ${dur(Math.round(r.last_seen - r.at))} · <span title="${esc(r.user_agent)}">${esc(browser(r.user_agent))}</span></li>`).join("")}</ul>`;
}
const browser = (ua) => {
  const b = /Edg\//.test(ua) ? "Edge" : /Firefox\//.test(ua) ? "Firefox" : /Chrome\//.test(ua) ? "Chrome" : /Safari\//.test(ua) ? "Safari" : "";
  const os = /iPhone|iPad/.test(ua) ? "iOS" : /Android/.test(ua) ? "Android" : /Mac OS X/.test(ua) ? "macOS" : /Windows/.test(ua) ? "Windows" : /Linux/.test(ua) ? "Linux" : "";
  return [b, os].filter(Boolean).join(" on ") || ua || "unknown browser";
};

let signup = false;
async function load() {
  const [list, auth] = await Promise.all([api("/api/admin/users"), api("/api/auth")]);
  users = list.users; signup = list.signup; me = auth.user;
  draw();
}

const QUESTIONS = {
  disable: "Disable this user? They are logged out everywhere and cannot log in until enabled again.",
  logout: "Log this user out everywhere? Their connected apps and tokens stop working.",
};

$("users").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const id = b.closest("[data-id]").dataset.id;
  const u = users.find((x) => x.id === id);
  const act = b.dataset.act;
  try {
    if (act === "logins") {
      if (history.has(id)) history.delete(id);
      else history.set(id, (await api(`/api/admin/users/${encodeURIComponent(id)}/logins`)).logins);
      return draw();
    }
    if (act === "delete") {
      const typed = prompt(`Delete ${u.display_name || "this user"} with all ${u.models} models and files? Type "delete" to confirm.`);
      if (typed !== "delete") return;
      await api(`/api/admin/users/${encodeURIComponent(id)}`, { method: "DELETE", body: { confirm: "delete" } });
      say(`Deleted ${u.display_name || "the user"}.`);
    } else {
      if (QUESTIONS[act] && !confirm(QUESTIONS[act])) return;
      await api(`/api/admin/users/${encodeURIComponent(id)}`, { method: "POST", body: { action: act, role: b.dataset.role } });
      say("Saved.");
    }
    await load();
  } catch (err) { say(err.message, true); }
});
$("q").addEventListener("input", draw);
load().catch((err) => say(err.message, true));
</script>
<script type="module" src="/static/nav.js"></script>
</body>
</html>
